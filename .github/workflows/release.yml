name: Rilis VidSplit (installer + portable Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Unduh model AI subtitle otomatis (Whisper small + base + opus-mt EN→ID, q8) + YOLO pembicara (v2.0.0)
        shell: bash
        # v0.51.2 — WAJIB dua-duanya: dulu hanya whisper-small, sehingga pilihan
        # "Cepat (Base)" gagal diam-diam → video diekspor tanpa subtitle
        # v2.0.0 — yolo-pembicara: model deteksi orang ZOOM PEMBICARA (±12 MB)
        run: bash scripts/unduh-model-ai.sh whisper-small whisper-base yolo-pembicara

      - name: Unduh mesin whisper.cpp + model ggml q5_1 (v3.3.0 — otak teks otomatis baru)
        shell: pwsh
        # Pola persis KolosalCut build-windows.yml: binary resmi ggml-org/whisper.cpp
        # (tag b5454) + 3 model q5_1 dari HuggingFace; gerbang ukuran anti-HTML/terpotong.
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "assets/whisper/bin", "assets/whisper/models" | Out-Null
          $tag = "b5454"
          $zip = "whisper-bin-x64.zip"
          for ($i = 1; $i -le 5; $i++) {
            try {
              Invoke-WebRequest -Uri "https://github.com/ggml-org/whisper.cpp/releases/download/$tag/$zip" -OutFile $zip -TimeoutSec 600
              break
            } catch {
              if ($i -eq 5) { throw "Gagal unduh whisper-cli: $_" }
              Start-Sleep -Seconds 20
            }
          }
          Expand-Archive -Path $zip -DestinationPath "whisper-zip" -Force
          $cli = Get-ChildItem -Path "whisper-zip" -Recurse -Filter "whisper-cli.exe" | Select-Object -First 1
          if (-not $cli) { throw "whisper-cli.exe tidak ditemukan di $zip" }
          Copy-Item $cli.FullName "assets/whisper/bin/whisper-cli.exe"
          # DLL pendamping (whisper.dll, ggml*.dll, SDL2.dll, dst.) WAJIB ikut
          Get-ChildItem -Path (Split-Path $cli.FullName) -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName "assets/whisper/bin/"
          }
          foreach ($m in @("tiny", "base", "small")) {
            $target = "assets/whisper/models/ggml-$m-q5_1.bin"
            for ($i = 1; $i -le 5; $i++) {
              try {
                Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$m-q5_1.bin" -OutFile $target -TimeoutSec 1800
                break
              } catch {
                if ($i -eq 5) { throw "Gagal unduh model $m: $_" }
                Start-Sleep -Seconds 20
              }
            }
          }
          # GERBANG — binary jalan + model cukup besar (anti halaman error HTML)
          & "assets/whisper/bin/whisper-cli.exe" --help *> $null
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw "whisper-cli.exe gagal dijalankan" }
          foreach ($m in @("tiny", "base", "small")) {
            $f = Get-Item "assets/whisper/models/ggml-$m-q5_1.bin"
            if ($f.Length -lt 20MB) { throw "Model $m terlalu kecil ($($f.Length) byte) — unduhan rusak" }
          }
          Write-Host "whisper.cpp + 3 model siap."

      - name: Pasang Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instal dependensi
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        # v0.58.0 — npm ci + package-lock.json: build rilis kini REPRODUCIBLE
        # (dulu npm install tanpa lockfile — versi dependensi bisa geser antar
        # rilis tanpa jejak; preseden bug v0.51.0 model hilang)
        run: npm ci --no-audit --no-fund

      - name: Build Next.js (standalone)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Paket Windows (NSIS installer + Portable)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx electron-builder --win nsis portable --publish never

      - name: Terbitkan release + unggah installer & portable
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          SETUP=$(ls release/VidSplit-Setup-*.exe | head -n 1)
          PORTABLE=$(ls release/VidSplit-Portable-*.exe | head -n 1)
          echo "Installer: $SETUP"
          echo "Portable:  $PORTABLE"
          CATATAN=$(cat << ISI
          ## VidSplit $TAG — installer + portable Windows

          Aplikasi desktop untuk kreator konten:

          - Ubah video horizontal menjadi vertikal 9:16 (blur lembut / potong penuh yang bisa digeser / warna solid)
          - Tulisan judul statis + tulisan "Part X" berganti otomatis sesuai durasi set
          - Split otomatis tepat di batas part — render paralel 1-4 part + akselerasi GPU otomatis (NVIDIA/Intel/AMD)
          - Background PNG/JPG otomatis di awal SETIAP hasil split
          - Semua diproses lokal di PC-mu dengan ffmpeg yang sudah dibundel — tidak ada unggahan ke internet

          ### Pilih salah satu versi

          - **VidSplit-Setup-$TAG.exe** — versi terinstal: di-install seperti aplikasi biasa, ada shortcut di Start Menu.
          - **VidSplit-Portable-$TAG.exe** — versi portabel: TANPA install, cukup satu file. Letakkan di mana saja
            (mis. flashdisk / D:), klik dua kali untuk langsung memakai. Data kerja (hasil split, background)
            tersimpan otomatis di folder "VidSplit-Data" di samping file exe — ikut pindah bersama file exe.

          ### Catatan untuk keduanya

          - Jika Windows SmartScreen muncul karena aplikasi belum ditandatangani: klik "More info" lalu "Run anyway"
          - Untuk versi portable: jangan letakkan exe di folder yang terkunci tulisannya (mis. C:\Program Files) —
            taruh di Desktop, Documents, D:, atau flashdisk agar folder data bisa dibuat
          - Persyaratan: Windows 10/11 64-bit
          ISI
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$SETUP" "$PORTABLE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$SETUP" "$PORTABLE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VidSplit $TAG" \
              --notes "$CATATAN"
          fi
