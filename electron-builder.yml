appId: com.zacrie85.vidsplit
productName: VidSplit
directories:
  output: release
files:
  - electron/**/*
  - package.json
afterPack: scripts/after-pack.cjs
extraResources:
  - from: assets/fonts
    to: fonts
  - from: node_modules/ffmpeg-static/ffmpeg.exe
    to: ffmpeg.exe
  - from: node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe
    to: ffprobe.exe
  # v0.20.0 — model pisah vokal AI (MDX-Net Kim Vocal 2, dibundel — 100% offline)
  - from: assets/vokal-ai
    to: vokal-ai
  # v0.26.0 — musik horor CC-BY bundel (kredit wajib ikut)
  - from: assets/musik-horor
    to: musik-horor
  # v0.28.0 — AI Voice Generator (Piper TTS neural, 100% offline, suara Indonesia)
  - from: assets/tts-piper
    to: tts-piper
  # v0.34.0 — pustaka gambar hantu Nusantara utk AI Text-to-Video Generator (offline)
  - from: assets/hantu
    to: hantu
  # v0.37.0 — pustaka gambar hantu REALISTIS (versi realistis, 100% offline)
  - from: assets/hantu-real
    to: hantu-real
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: VidSplit-Setup-${version}.${ext}
portable:
  artifactName: VidSplit-Portable-${version}.${ext}
