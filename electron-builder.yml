appId: com.zacrie85.vidsplit
productName: VidSplit
directories:
  output: release
files:
  - electron/**/*
  - package.json
afterPack: scripts/after-pack.cjs
extraResources:
  - from: assets/fonts
    to: fonts
  - from: node_modules/ffmpeg-static/ffmpeg.exe
    to: ffmpeg.exe
  - from: node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe
    to: ffprobe.exe
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: VidSplit-Setup-${version}.${ext}
portable:
  artifactName: VidSplit-Portable-${version}.${ext}
