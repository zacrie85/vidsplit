appId: com.zacrie85.vidsplit
productName: VidSplit
directories:
  output: release
files:
  - electron/**/*
  - package.json
extraResources:
  - from: .next/standalone
    to: server
  - from: .next/static
    to: server/vidsplit/.next/static
  - from: public
    to: server/vidsplit/public
  - from: assets/fonts
    to: fonts
  - from: node_modules/ffmpeg-static/ffmpeg.exe
    to: ffmpeg.exe
  - from: node_modules/ffprobe-static/bin/win/x64/ffprobe.exe
    to: ffprobe.exe
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: VidSplit-Setup-${version}.${ext}
